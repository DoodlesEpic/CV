name: Build CV

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX documents
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            cv.tex
            cv-en.tex
          compiler: pdflatex

      - name: Upload Portuguese PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: curriculo-eduardo-moraes
          path: cv.pdf
          if-no-files-found: error

      - name: Upload English PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-eduardo-moraes-en
          path: cv-en.pdf
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" cv.pdf cv-en.pdf \
            --target "${{ github.sha }}" \
            --title "CV v${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}.

          - \`cv.pdf\` — Portuguese (Brazil)
          - \`cv-en.pdf\` — English"
